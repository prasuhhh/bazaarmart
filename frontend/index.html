<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BazaarMart</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script>
      // Runs before the first paint, so Night shift never flashes the Day colours.
      (function () {
        var theme = null;
        try { theme = localStorage.getItem('bazaarmart_theme'); } catch (error) { theme = null; }
        if (theme !== 'day' && theme !== 'night') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
